    <style>
        * {

    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: white;
    min-height: 100vh;
}


nav {
    text-align: center;
    padding-top: 30px;
}

nav h1 {
    font-size: 32px;
    margin-bottom: 15px;
}


.menu {
    display: flex;
    justify-content: center;

.menu a {

        .contact-container {
            width: 80%;
            margin: 50px auto;
        }

        .contact-info,
        .contact-form {
            background: white;
            padding: 35px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .contact-info h1 {
            color: #4f8f8f;
            margin-bottom: 10px;
        }

        .contact-info h3 {
            margin-bottom: 3px;
        }

        .contact-info p {
            color: #555;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: none;
            background: #f5f5f5;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .contact-form textarea {
            height: 120px;
            resize: none;
        }

        button {
            padding: 12px 25px;
            background: #4f8f8f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
